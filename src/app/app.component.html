<div class="flex flex-col min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-100">

  <!-- Navbar -->
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto flex flex-wrap items-center justify-between py-4 px-4">
      <button mat-button class="text-2xl font-bold text-blue-700 tracking-wide hover:text-blue-900 transition" routerLink="/">
        <span class="inline-flex items-center gap-2">
          <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21H5a2 2 0 01-2-2V7a2 2 0 012-2h4l2-2 2 2h4a2 2 0 012 2v12a2 2 0 01-2 2z"/>
          </svg>
          Blog
        </span>
      </button>
      <div class="flex flex-wrap space-x-2 items-center">
        <button mat-button class="text-gray-700 hover:text-blue-600 font-medium px-4 py-2 rounded transition" [routerLink]="['/']">Home</button>

        <ng-container *ngIf="authService.isAuthenticated$ | async; else loggedOut">
          <button mat-button class="text-gray-700 hover:text-blue-600 font-medium px-4 py-2 rounded transition" [routerLink]="['/create']">
            <span class="inline-flex items-center gap-1">
              <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
              </svg>
              Create Post
            </span>
          </button>
          <button mat-button class="text-gray-700 hover:text-blue-600 font-medium px-4 py-2 rounded transition" [routerLink]="['/categories']">
            <span class="inline-flex items-center gap-1">
              <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
              Manage Categories
            </span>
          </button>
          <button mat-button class="text-red-600 hover:text-red-800 font-medium px-4 py-2 rounded transition" (click)="logout()">
            <span class="inline-flex items-center gap-1">
              <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1"/>
              </svg>
              Logout
            </span>
          </button>
        </ng-container>
        <ng-template #loggedOut>
          <button mat-button class="text-blue-700 hover:text-blue-900 font-medium px-4 py-2 rounded transition" [routerLink]="['/login']">
            <span class="inline-flex items-center gap-1">
              <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
              Login
            </span>
          </button>
        </ng-template>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="w-full flex-1 p-4 ">
    <div class=" min-h-[60vh]">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gradient-to-r from-blue-700 to-blue-500 text-gray-100 p-3 text-center mt-8 shadow-inner">
    <div class="flex flex-col items-center gap-2">
      <span class="font-semibold text-lg">© 2025 My Blog App</span>
      <span class="text-sm opacity-80">Crafted with <span class="text-pink-400">♥</span> using Angular &amp; .NET Core</span>
    </div>
  </footer>
</div>
