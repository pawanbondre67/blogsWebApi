<div class="max-w-lg mx-auto mt-6 bg-white rounded-lg shadow p-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Category Manager</h2>
  <div>
    <h3 class="text-lg font-semibold mb-2 text-gray-700">Manage Categories</h3>
    <form (ngSubmit)="createCategory()" *ngIf="authService.isAuthenticated$ | async" class="mb-6">
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">New Category</label>
        <input
          type="text"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          [(ngModel)]="newCategory.name"
          name="name"
          placeholder="Category name"
          required
        >
      </div>
      <button
        type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
      >
        Add Category
      </button>
    </form>
    <h4 class="text-md font-semibold mt-4 mb-2 text-gray-700">Existing Categories</h4>
    <div *ngIf="categories.length === 0" class="bg-blue-50 text-blue-700 px-4 py-2 rounded mb-4">
      No categories found.
    </div>
    <div *ngFor="let category of categories" class="bg-gray-50 rounded shadow-sm mb-3">
      <div class="p-4">
        <div *ngIf="editingCategory?.id !== category.id" class="flex items-center justify-between">
          <span class="text-gray-800">{{ category.name }} <span class="text-gray-500 text-sm">({{ category.postCount }} posts)</span></span>
          <div class="flex gap-2" *ngIf="authService.isAuthenticated$ | async">
            <button
              (click)="editCategory(category)"
              class="bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300 transition text-sm"
            >
              Edit
            </button>
            <button
              (click)="deleteCategory(category.id)"
              class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition text-sm"
            >
              Delete
            </button>
          </div>
        </div>
        <form *ngIf="editingCategory?.id === category.id" (ngSubmit)="updateCategory()" class="mt-2 flex gap-2">
          <input
            type="text"
            class="flex-1 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
            [(ngModel)]="editingCategory!.name"
            name="name"
            required
          >
          <button
            type="submit"
            class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 transition text-sm"
          >
            Save
          </button>
          <button
            type="button"
            (click)="editingCategory = null"
            class="bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300 transition text-sm"
          >
            Cancel
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
